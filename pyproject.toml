[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG over annual-report PDFs, inspired by IlyaRice/RAG-Challenge-2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "mineru[core]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
