[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG over annual-report PDFs, inspired by IlyaRice/RAG-Challenge-2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "mineru[core]>=2.0,<3.0",
    "openai>=1.40",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "tiktoken>=0.7",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# ragas 0.4 的 evaluate() 走经典 LangchainLLM 路径（collections 新指标不经过
# evaluate），须锁 langchain 0.3 生态：langchain-community>=0.4 已移除其 import
metrics = [
    "ragas>=0.4,<1.0",
    "langchain<0.4",
    "langchain-core<1.0",
    "langchain-community<0.4",
    "langchain-openai<0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
